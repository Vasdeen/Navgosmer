name: Update data/index.json

on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.json
        run: |
          ls -la data || true
          find data -maxdepth 1 -type f -iname '*.csv' -printf '%f\n' | sort | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()], ensure_ascii=False, indent=2))' > /tmp/index.json
          cat /tmp/index.json
          cp /tmp/index.json data/index.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || (git commit -m "Update data/index.json" && git push)
