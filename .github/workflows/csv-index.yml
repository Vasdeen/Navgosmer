name: Update data/index.json

on:
  push:
    paths:
      - 'data/**'
      - '!data/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json
        run: |
          echo "Содержимое data/:"
          ls -la data
          python3 - <<'PY'
          import json, os, sys
          files = sorted(f for f in os.listdir("data") if f.lower().endswith(".csv"))
          print("Найдено CSV:", files)
          if not files:
              sys.exit("В data/ нет .csv файлов — index.json не обновлён")
          with open("data/index.json", "w", encoding="utf-8") as fh:
              json.dump(files, fh, ensure_ascii=False, indent=2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || (git commit -m "Update data/index.json" && git push)
