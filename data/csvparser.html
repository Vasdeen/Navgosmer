```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Parser</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            max-height: 500px;
            overflow: auto;
        }
    </style>
</head>

<body>

<h1>CSV Parser</h1>

<input type="file" id="fileInput" accept=".csv">

<button id="parseButton">Parse CSV</button>

<div id="status"></div>

<pre id="output"></pre>


<script>

    // Detect CSV delimiter automatically.
    // The uploaded measures_test.csv uses ";" rather than ",".
    function detectDelimiter(text) {
        const candidates = [";", ",", "\t", "|"];
        const sample = text.slice(0, Math.min(text.length, 10000));

        function countOutsideQuotes(delimiter) {
            let count = 0;
            let insideQuotes = false;

            for (let i = 0; i < sample.length; i++) {
                const char = sample[i];
                const nextChar = sample[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === delimiter && !insideQuotes) {
                    count++;
                }
            }

            return count;
        }

        return candidates.reduce((best, delimiter) => {
            return countOutsideQuotes(delimiter) > countOutsideQuotes(best)
                ? delimiter
                : best;
        }, candidates[0]);
    }

    // Parse CSV text into an array of objects.
    // Supports:
    // - semicolon, comma, tab and pipe delimiters
    // - quoted fields
    // - escaped quotes ("")
    // - commas/semicolons inside quoted fields
    // - multiline quoted fields
    // - Windows/Unix line endings
    // - UTF-8 BOM
    function parseCSV(text, delimiter = null) {
        text = text.replace(/^\uFEFF/, "");

        if (!delimiter) {
            delimiter = detectDelimiter(text);
        }

        const rows = [];
        let row = [];
        let field = "";
        let insideQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (insideQuotes && nextChar === '"') {
                    field += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }
                continue;
            }

            if (char === delimiter && !insideQuotes) {
                row.push(field);
                field = "";
                continue;
            }

            if ((char === "\n" || char === "\r") && !insideQuotes) {
                if (char === "\r" && nextChar === "\n") {
                    i++;
                }

                row.push(field);
                field = "";

                // Do not add completely empty rows.
                if (row.some(value => value.trim() !== "")) {
                    rows.push(row);
                }

                row = [];
                continue;
            }

            field += char;
        }

        // Last field / row.
        if (field !== "" || row.length > 0) {
            row.push(field);

            if (row.some(value => value.trim() !== "")) {
                rows.push(row);
            }
        }

        if (rows.length === 0) {
            return {
                data: [],
                delimiter
            };
        }

        // First row = column names.
        // Remove accidental BOM and surrounding whitespace from headers,
        // but keep the actual contents of data fields unchanged.
        const headers = rows[0].map((header, index) => {
            let value = header;
            if (index === 0) {
                value = value.replace(/^\uFEFF/, "");
            }
            return value.trim();
        });

        const data = rows.slice(1).map(row => {
            const object = {};

            headers.forEach((header, index) => {
                object[header] = row[index] ?? "";
            });

            return object;
        });

        return {
            data,
            delimiter
        };
        console.log(data);
    }


    document
        .getElementById("parseButton")
        .addEventListener("click", async () => {

            const fileInput = document.getElementById("fileInput");

            const status = document.getElementById("status");
            const output = document.getElementById("output");

            if (!fileInput.files.length) {

                status.textContent = "Please select a CSV file.";

                return;
            }

            const file = fileInput.files[0];

            status.textContent = "Reading file...";
            output.textContent = "";

            try {

                const start = performance.now();

                // Read CSV as UTF-8.
                // The supplied measures_test.csv is UTF-8 with BOM.
                const text = await file.text();

                // Parse CSV and automatically detect the delimiter.
                const result = parseCSV(text);
                const data = result.data;
                const delimiterName = result.delimiter === ";" ? "semicolon (;)"
                    : result.delimiter === "," ? "comma (,)"
                    : result.delimiter === "\t" ? "tab"
                    : result.delimiter;

                console.log("Detected CSV delimiter:", delimiterName);

                const end = performance.now();

                status.textContent =
                    `Parsed ${data.length.toLocaleString()} rows, ` +
                    `${Object.keys(data[0] || {}).length} columns, ` +
                    `delimiter: ${delimiterName} in ` +
                    `${(end - start).toFixed(2)} ms`;

                // Display result
                output.textContent =
                    JSON.stringify(data.slice(0, 100), null, 2);

                console.log("Parsed data:", data);

            }
            catch (error) {

                status.textContent = "Error parsing CSV.";

                console.error(error);
            }
        });

</script>

</body>
</html>
