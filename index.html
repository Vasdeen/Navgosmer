<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дайджест мер поддержки — Башкортостан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3C4A66;
    --paper:#F4F6F1;
    --paper-raised:#FFFFFF;
    --gold:#C9962C;
    --gold-deep:#A87A1E;
    --forest:#2F5D50;
    --muted:#5B6472;
    --line:#DBE1DD;
    --line-soft:#E8ECE7;
    --danger:#B3452F;

    --font-display: 'Lora', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
  }
  a{ color:inherit; }

  /* ============ HEADER ============ */
  .topbar{
    background:var(--ink);
    color:#EFEDE6;
    padding:0 28px;
    display:flex;
    align-items:center;
    gap:24px;
    height:72px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    white-space:nowrap;
  }
  .brand svg{ flex-shrink:0; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text .kicker{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .brand-text .title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    color:#fff;
  }

  .searchwrap{
    flex:1;
    position:relative;
    max-width:640px;
  }
  .searchwrap input{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    padding:11px 16px 11px 40px;
    color:#fff;
    font-family:var(--font-body);
    font-size:14.5px;
    outline:none;
    transition:background .15s, border-color .15s;
  }
  .searchwrap input::placeholder{ color:#B7C0CE; }
  .searchwrap input:focus{
    background:rgba(255,255,255,.14);
    border-color:var(--gold);
  }
  .searchwrap .icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    opacity:.7; pointer-events:none;
  }

  .topbar-meta{
    font-family:var(--font-mono);
    font-size:12px;
    color:#B7C0CE;
    white-space:nowrap;
  }

  .filters-toggle{
    display:none;
    background:var(--gold);
    color:var(--ink);
    border:none;
    border-radius:7px;
    padding:9px 14px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  /* ============ LAYOUT ============ */
  .layout{
    display:grid;
    grid-template-columns: 340px 1fr 300px;
    gap:0;
    height:calc(100vh - 72px);
  }

  /* ---- LIST (left) ---- */
  .list-pane{
    border-right:1px solid var(--line);
    background:var(--paper-raised);
    overflow-y:auto;
  }
  .list-pane-head{
    padding:16px 18px 14px;
    position:sticky; top:0;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line-soft);
    z-index:5;
  }
  .list-pane-head .count{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
  }
  .list-pane-head h2{
    margin:2px 0 0;
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
  }

  .item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--line-soft);
    padding:14px 18px;
    cursor:pointer;
    position:relative;
  }
  .item:hover{ background:#EFF2EC; }
  .item.active{ background:#EAF0E7; }
  .item.active::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--forest);
  }
  .item-top{
    display:flex; align-items:center; gap:8px; margin-bottom:6px;
  }
  .stamp{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:600;
    color:var(--gold-deep);
    border:1px solid var(--gold);
    border-radius:4px;
    padding:1px 6px;
    letter-spacing:.03em;
  }
  .item-date{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    margin-left:auto;
  }
  .item-title{
    font-family:var(--font-display);
    font-size:14.5px;
    font-weight:600;
    line-height:1.3;
    margin:0 0 6px;
    color:var(--ink);
  }
  .item-meta{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;
  }
  .tag{
    font-size:11px;
    padding:2px 7px;
    border-radius:20px;
    background:#E7ECE3;
    color:var(--forest);
    white-space:nowrap;
  }
  .tag.site{ background:#EFEAE0; color:var(--gold-deep); }
  .item-desc{
    font-size:12.5px;
    color:var(--muted);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin:0;
  }
  .empty-msg{
    padding:32px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }

  /* ---- DETAIL (center) ---- */
  .detail-pane{
    overflow-y:auto;
    padding:36px 44px 60px;
  }
  .detail-pane .placeholder{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted);
    text-align:center;
    gap:10px;
  }
  .detail-pane .placeholder svg{ opacity:.35; }

  .detail-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    margin-bottom:6px;
  }
  .detail-stamp-row{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .detail-title{
    font-family:var(--font-display);
    font-size:29px;
    font-weight:600;
    line-height:1.25;
    margin:0 0 18px;
    max-width:640px;
  }
  .detail-meta{
    display:grid;
    grid-template-columns:repeat(2, minmax(180px,1fr));
    gap:12px 28px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 22px;
    margin-bottom:26px;
  }
  .meta-item .k{
    font-family:var(--font-mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin-bottom:3px;
  }
  .meta-item .v{ font-size:14px; color:var(--ink); }
  .meta-item .v.mono{ font-family:var(--font-mono); font-size:13px; }

  .detail-section{ margin-bottom:26px; max-width:680px; }
  .detail-section h3{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    margin:0 0 8px;
    color:var(--forest);
  }
  .detail-section p{ margin:0; color:var(--ink-soft); }

  .detail-actions{ display:flex; gap:10px; margin-top:32px; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    border:1px solid transparent;
    display:inline-flex; align-items:center; gap:8px;
    text-decoration:none;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#0F1B33; }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-small{
    font-size:12px;
    padding:7px 12px;
    width:100%;
    justify-content:center;
    margin-top:12px;
  }

  /* ---- Печатный шаблон результатов поиска (весь список, не одна карточка) ---- */
  .print-only{ display:none; }
  #printResults .print-title{
    font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 4px;
  }
  #printResults .print-sub{
    font-family:var(--font-mono); font-size:12px; color:var(--muted); margin:0 0 24px;
  }
  #printResults .print-item{
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  #printResults .print-item-top{
    display:flex; gap:10px; align-items:center; margin-bottom:6px;
    font-family:var(--font-mono); font-size:11px; color:var(--muted);
  }
  #printResults .print-item h2{
    font-family:var(--font-display); font-size:15.5px; margin:0 0 6px;
  }
  #printResults .print-meta{
    font-size:12px; color:var(--muted); margin:0 0 4px;
  }
  #printResults .print-link{
    font-family:var(--font-mono); font-size:11px; color:var(--forest); word-break:break-all;
  }

  /* ---- FILTERS (right) ---- */
  .filters-pane{
    border-left:1px solid var(--line);
    background:var(--paper-raised);
    overflow-y:auto;
    padding:20px 20px 40px;
  }
  .filters-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .filters-head h2{
    font-family:var(--font-display);
    font-size:16px; font-weight:600; margin:0;
  }
  .reset-link{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--danger);
    background:none; border:none; cursor:pointer;
    text-decoration:underline;
  }
  .filter-group{ margin-bottom:22px; }
  .filter-group > .label{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--muted);
    margin-bottom:10px;
  }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:12.5px;
    padding:5px 11px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .chip[aria-pressed="true"]{
    background:var(--forest);
    border-color:var(--forest);
    color:#fff;
  }
  .date-range{ display:flex; align-items:center; gap:8px; }
  .date-range input, .text-filter input{
    width:100%;
    font-family:var(--font-body);
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
  }
  .date-range span{ color:var(--muted); font-size:12px; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1180px){
    .layout{ grid-template-columns: 300px 1fr; }
    .filters-pane{
      position:fixed; top:72px; right:0; bottom:0; width:300px;
      transform:translateX(100%);
      transition:transform .2s ease;
      box-shadow:-8px 0 24px rgba(0,0,0,.12);
    }
    .filters-pane.open{ transform:translateX(0); }
    .filters-toggle{ display:inline-flex; align-items:center; gap:6px; }
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; height:auto; }
    .list-pane{ max-height:46vh; }
    .detail-pane{ padding:26px 20px 40px; }
    .brand-text .title{ font-size:16px; }
    .topbar-meta{ display:none; }
  }

  /* ============ PRINT ============ */
  @media print{
    body:not(.printing-results) .topbar,
    body:not(.printing-results) .list-pane,
    body:not(.printing-results) .filters-pane,
    body:not(.printing-results) .detail-actions{ display:none !important; }
    body:not(.printing-results) .layout{ display:block; height:auto; }
    body:not(.printing-results) .detail-pane{ padding:0; }

    /* Печать результата поиска целиком — скрываем весь обычный интерфейс,
       показываем только #printResults, наполненный текущей выборкой */
    body.printing-results .topbar,
    body.printing-results .layout{ display:none !important; }
    body.printing-results #printResults{ display:block; padding:0 8px; }

    body{ background:#fff; }
  }
</style>
</head>

<div class="layout">

  </main>

  <!-- RIGHT: FILTERS -->
  <aside class="filters-pane" id="filtersPane">
    <div class="filters-head">
      <h2>Фильтры</h2>
      <button class="reset-link" id="resetFilters">Сбросить всё</button>
    </div>

    <div class="filter-group">
      <div class="label">Сфера реализации</div>
      <div class="chip-list" id="sphereChips"></div>
    </div>

    <div class="filter-group">
      <div class="label">Тип поддержки</div>
      <div class="chip-list" id="typeChips"></div>
    </div>

    <div class="filter-group">
      <div class="label">Дата публикации</div>
      <div class="date-range">
        <input type="date" id="pubFrom"><span>—</span><input type="date" id="pubTo">
      </div>
    </div>

    <div class="filter-group">
      <div class="label">Дата начала меры</div>
      <div class="date-range">
        <input type="date" id="startFrom"><span>—</span><input type="date" id="startTo">
      </div>
    </div>

    <div class="filter-group text-filter">
      <div class="label">НПА (реквизиты)</div>
      <input type="text" id="npaFilter" placeholder="например, № 295">
    </div>
  </aside>

</div>

<div id="printResults" class="print-only"></div>

const state = {
  query:"",
  spheres:new Set(),
  types:new Set(),
  pubFrom:"", pubTo:"",
  startFrom:"", startTo:"",
  npa:"",
  selected:null
};

function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function uniqueSorted(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b,'ru')); }

function buildChips(container, values, activeSet, onToggle){
  container.innerHTML = "";
  values.forEach(v=>{
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = v;
    chip.setAttribute("aria-pressed", activeSet.has(v) ? "true" : "false");
    chip.addEventListener("click", ()=>{
      if(activeSet.has(v)) activeSet.delete(v); else activeSet.add(v);
      onToggle();
    });
    container.appendChild(chip);
  });
}

function matchesFilters(item){
  if(state.spheres.size && !state.spheres.has(item.sphere)) return false;
  if(state.types.size && !state.types.has(item.type)) return false;
  if(state.pubFrom && item.pub < state.pubFrom) return false;
  if(state.pubTo && item.pub > state.pubTo) return false;
  if(state.startFrom && (!item.start || item.start < state.startFrom)) return false;
  if(state.startTo && (!item.start || item.start > state.startTo)) return false;
  if(state.npa && !item.npa.toLowerCase().includes(state.npa.toLowerCase())) return false;
  if(state.query){
    const q = state.query.toLowerCase();
    const hay = (item.title+" "+item.summary+" "+item.npa+" "+item.vid+" "+item.sphere).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const filtered = DATA.filter(matchesFilters);

  document.getElementById("listCount").textContent = `${filtered.length} записей`;
  document.getElementById("topbarMeta").textContent = `${filtered.length} из ${DATA.length} записей`;

  const listEl = document.getElementById("listItems");
  listEl.innerHTML = "";

  if(!filtered.length){
    listEl.innerHTML = `<div class="empty-msg">Ничего не найдено — попробуйте изменить условия поиска или сбросить фильтры.</div>`;
  }

  filtered.forEach(item=>{
    const el = document.createElement("button");
    el.className = "item" + (state.selected === item.num ? " active" : "");
    el.innerHTML = `
      <div class="item-top">
        <span class="stamp">№ ${item.num}</span>
        <span class="item-date">${fmtDate(item.pub)}</span>
      </div>
      <p class="item-title">${item.title}</p>
      <div class="item-meta">
        <span class="tag site">${item.site}</span>
        <span class="tag">${item.sphere}</span>
      </div>
      <p class="item-desc">${item.summary}</p>
    `;
    el.addEventListener("click", ()=>{ state.selected = item.num; renderDetail(item); render(); });
    listEl.appendChild(el);
  });

  buildChips(document.getElementById("sphereChips"), uniqueSorted(DATA.map(d=>d.sphere)), state.spheres, render);
  buildChips(document.getElementById("typeChips"), uniqueSorted(DATA.map(d=>d.type)), state.types, render);
}

function renderDetail(item){
  const pane = document.getElementById("detailPane");
  pane.innerHTML = `
    <div class="detail-stamp-row">
      <span class="stamp">№ ${item.num}</span>
      <span class="tag site">${item.site}</span>
      <span class="tag">${item.sphere}</span>
    </div>
    <h1 class="detail-title">${item.title}</h1>

    <div class="detail-meta">
      <div class="meta-item"><div class="k">Тип поддержки</div><div class="v">${item.type}</div></div>
      <div class="meta-item"><div class="k">Вид меры</div><div class="v">${item.vid || "—"}</div></div>
      <div class="meta-item"><div class="k">Дата публикации</div><div class="v mono">${fmtDate(item.pub)}</div></div>
      <div class="meta-item"><div class="k">Срок проведения</div><div class="v mono">${fmtDate(item.start)} — ${fmtDate(item.end)}</div></div>
      <div class="meta-item" style="grid-column:1/-1"><div class="k">НПА</div><div class="v mono">${item.npa || "не указано"}</div></div>
    </div>

    <div class="detail-section">
      <h3>Краткое резюме</h3>
      <p>${item.summary}</p>
    </div>

    <div class="detail-actions">
      <a class="btn btn-primary" href="${item.link}" target="_blank" rel="noopener">Открыть источник ↗</a>
      <button class="btn btn-ghost" onclick="window.print()">Скачать PDF</button>
    </div>
  `;
}

document.getElementById("searchInput").addEventListener("input", e=>{ state.query = e.target.value; render(); });
document.getElementById("pubFrom").addEventListener("change", e=>{ state.pubFrom = e.target.value; render(); });
document.getElementById("pubTo").addEventListener("change", e=>{ state.pubTo = e.target.value; render(); });
document.getElementById("startFrom").addEventListener("change", e=>{ state.startFrom = e.target.value; render(); });
document.getElementById("startTo").addEventListener("change", e=>{ state.startTo = e.target.value; render(); });
document.getElementById("npaFilter").addEventListener("input", e=>{ state.npa = e.target.value; render(); });

document.getElementById("resetFilters").addEventListener("click", ()=>{
  state.spheres.clear(); state.types.clear();
  state.pubFrom=""; state.pubTo=""; state.startFrom=""; state.startTo=""; state.npa="";
  document.getElementById("pubFrom").value="";
  document.getElementById("pubTo").value="";
  document.getElementById("startFrom").value="";
  document.getElementById("startTo").value="";
  document.getElementById("npaFilter").value="";
  render();
});

document.getElementById("filtersToggle").addEventListener("click", ()=>{
  document.getElementById("filtersPane").classList.toggle("open");
});

function downloadResultsPDF(){
  const filtered = DATA.filter(matchesFilters);
  const container = document.getElementById("printResults");
  const today = new Date().toLocaleDateString("ru-RU");

  container.innerHTML = `
    <h1 class="print-title">Дайджест мер поддержки — результат поиска</h1>
    <p class="print-sub">Сформировано ${today} · ${filtered.length} ${filtered.length === 1 ? "запись" : "записей"}</p>
    ${filtered.map(item => `
      <article class="print-item">
        <div class="print-item-top">
          <span class="stamp">№ ${item.num}</span>
          <span>${fmtDate(item.pub)}</span>
        </div>
        <h2>${item.title}</h2>
        <p class="print-meta">${item.site} · ${item.sphere} · ${item.type}${item.vid ? " · " + item.vid : ""}</p>
        <p class="print-meta">НПА: ${item.npa || "не указано"} · Срок: ${fmtDate(item.start)} — ${fmtDate(item.end)}</p>
        <p>${item.summary}</p>
        <p class="print-link">${item.link}</p>
      </article>
    `).join("")}
  `;

  document.body.classList.add("printing-results");
  window.print();
}

// Возвращаем обычный интерфейс после печати/сохранения в PDF —
// и по событию afterprint (Chrome/Edge/Firefox), и запасным
// таймером на случай, если браузер это событие не пришлёт.
window.addEventListener("afterprint", ()=> document.body.classList.remove("printing-results"));
document.getElementById("downloadResultsBtn").addEventListener("click", ()=>{
  downloadResultsPDF();
  setTimeout(()=> document.body.classList.remove("printing-results"), 1000);
});

render();
</script>
