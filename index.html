<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дайджест мер поддержки — Башкортостан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="14" stroke="#C9962C" stroke-width="1.4"/>
      <path d="M15 5 L17 12.5 L24.5 12.9 L18.3 17.2 L20.6 24.4 L15 19.9 L9.4 24.4 L11.7 17.2 L5.5 12.9 L13 12.5 Z"
            fill="none" stroke="#EFEDE6" stroke-width="1.1"/>
    </svg>
    <div class="brand-text">
      <span class="kicker">ЦСР · Республика Башкортостан</span>
      <span class="title">Дайджест мер поддержки</span>
    </div>
  </div>

  <div class="searchwrap">
    <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5.2" stroke="#EFEDE6" stroke-width="1.3"/>
      <line x1="11" y1="11" x2="15" y2="15" stroke="#EFEDE6" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Поиск по заголовку, НПА, описанию…" autocomplete="off">
  </div>

  <button class="filters-toggle" id="filtersToggle">Фильтры</button>
  <div class="topbar-meta" id="topbarMeta">— из — записей</div>
</header>

<div class="layout">

  <!-- LEFT: LIST -->
  <aside class="list-pane">
    <div class="list-pane-head">
      <div class="count" id="listCount">14 записей</div>
      <h2>Публикации</h2>
      <button class="btn btn-ghost btn-small" id="downloadResultsBtn">⭳ Скачать результат поиска в PDF</button>
    </div>
    <div id="listItems"></div>
  </aside>


  <!-- CENTER: DETAIL -->
  <main class="detail-pane" id="detailPane">
    <div class="placeholder">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
        <path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.2"/>
        <path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <p>Выберите публикацию слева, чтобы увидеть подробности</p>
    </div>
  </main>

  <!-- RIGHT: FILTERS -->
  <aside class="filters-pane" id="filtersPane">
    <div class="filters-head">
      <h2>Фильтры</h2>
      <button class="reset-link" id="resetFilters">Сбросить всё</button>
    </div>

    <div class="filter-group">
      <div class="label">Сфера реализации</div>
      <div class="chip-list" id="sphereChips"></div>
    </div>

    <div class="filter-group">
      <div class="label">Тип поддержки</div>
      <div class="chip-list" id="typeChips"></div>
    </div>

    <div class="filter-group">
      <div class="label">Дата публикации</div>
      <div class="date-range">
        <input type="date" id="pubFrom"><span>—</span><input type="date" id="pubTo">
      </div>
    </div>

    <div class="filter-group">
      <div class="label">Дата начала меры</div>
      <div class="date-range">
        <input type="date" id="startFrom"><span>—</span><input type="date" id="startTo">
      </div>
    </div>

    <div class="filter-group text-filter">
      <div class="label">НПА (реквизиты)</div>
      <input type="text" id="npaFilter" placeholder="например, № 295">
    </div>
  </aside>

</div>

<div id="printResults" class="print-only"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="./js/fonts/Roboto-normal.js"></script>
<script src="./js/fonts/Roboto-bold.js"></script>

<script src="js/app3.js"></script>
<script src="js/app3.js"></script> 
</body>
</html>
